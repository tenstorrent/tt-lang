    <text x="215" y="593" class="small" text-anchor="middle">NoC relay; FP32 accumulator remains in L1</text>
    <path d="M215 604 V616" class="route" stroke="#475569" marker-end="url(#arrow-gray)"/>
    <rect x="58" y="618" width="314" height="50" class="compute"/>
