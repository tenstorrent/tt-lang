<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Upstream TT-Metal four-device all-gather minimal matmul</title>
  <desc id="description">Four Blackhole devices form a bidirectional ring. Each device sends its local activation shard, receives and forwards remote shards, writes remote activation tiles to gather-scratch DRAM, and reads local and remote activation blocks while matmul proceeds.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7e22ce"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 19px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #334155; }
      .tiny { font-size: 11px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .device { fill: #ffffff; stroke: #334155; stroke-width: 1.7; rx: 9; }
      .dram { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.4; rx: 6; }
      .l1 { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; rx: 6; }
      .scratch { fill: #ffedd5; stroke: #c2410c; stroke-width: 1.4; rx: 6; }
      .compute { fill: #fef3c7; stroke: #d97706; stroke-width: 1.4; rx: 6; }
      .output { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.4; rx: 6; }
      .table { fill: #ffffff; stroke: #64748b; stroke-width: 1.2; rx: 6; }
      .rule { stroke: #cbd5e1; stroke-width: 1; }
      .route { fill: none; stroke-width: 2.4; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>
  <text x="40" y="42" class="title">Upstream TT-Metal all-gather + matmul + bias: Four devices</text>
  <text x="40" y="68" class="subtitle">D=4 · M, K, and N denote global matrix dimensions · Wan2.2 Blackhole 4×1 participant ring</text>

  <rect x="1085" y="10" width="475" height="108" class="table"/>
  <text x="1100" y="27" class="label">Tensor placement</text>
  <text x="1100" y="42" class="tiny">Tensor</text>
  <text x="1215" y="42" class="tiny">Distribution</text>
  <text x="1325" y="42" class="tiny">Allocation on device r</text>
  <path d="M1098 46 H1547" class="rule"/>
  <text x="1100" y="59" class="tiny">A</text><text x="1215" y="59" class="tiny">K-sharded</text><text x="1325" y="59" class="tiny">Aᵣ: M × K/4</text>
  <text x="1100" y="72" class="tiny">gather scratch</text><text x="1215" y="72" class="tiny">private</text><text x="1325" y="72" class="tiny">M × K; remote 3/4 used</text>
  <text x="1100" y="85" class="tiny">B</text><text x="1215" y="85" class="tiny">replicated</text><text x="1325" y="85" class="tiny">K × N</text>
  <text x="1100" y="98" class="tiny">bias</text><text x="1215" y="98" class="tiny">replicated</text><text x="1325" y="98" class="tiny">1 × N</text>
  <text x="1100" y="111" class="tiny">O</text><text x="1215" y="111" class="tiny">replicated</text><text x="1325" y="111" class="tiny">M × N</text>

  <text x="40" y="106" class="section">Bidirectional fabric ring</text>
  <rect x="40" y="122" width="1520" height="184" class="panel"/>

  <rect x="120" y="168" width="180" height="56" class="scratch"/>
  <text x="210" y="191" class="label" text-anchor="middle">Device 0</text>
  <text x="210" y="211" class="small" text-anchor="middle">two fabric links</text>
  <rect x="500" y="168" width="180" height="56" class="scratch"/>
