  <path d="M680 178 H878" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M1060 178 H1258" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M1440 178 H1518 V142 H82 V178 H118" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <text x="800" y="138" class="tiny" text-anchor="middle">ring direction 0: receive, forward, and transmit activation packets</text>

  <path d="M1260 214 H1062" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M880 214 H682" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M500 214 H302" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M120 214 H82 V266 H1518 V214 H1442" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <text x="800" y="286" class="tiny" text-anchor="middle">ring direction 1 · six fabric workers per link · remote activation packets continue to the next device</text>

  <text x="40" y="344" class="section">Per-device DRAM ownership and worker computation</text>
  <text x="700" y="344" class="tiny">Blue: DRAM · green: L1 DFB · orange: fabric · yellow: worker computation · purple: output</text>

