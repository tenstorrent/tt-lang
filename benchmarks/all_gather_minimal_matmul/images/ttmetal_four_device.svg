  <text x="800" y="775" class="small" text-anchor="middle">B and bias are replicated, so the four O allocations contain the same M × N result; they are not one M × 4N result.</text>

  <rect x="40" y="788" width="1520" height="258" class="panel"/>
  <text x="65" y="820" class="section">Streaming overlap on every device</text>
  <text x="65" y="842" class="small">Conceptual first-N-pass schedule; bar widths are illustrative. Independent fabric, data-movement, and compute kernels execute concurrently.</text>
  <text x="70" y="891" class="label">Fabric ring</text>
  <text x="70" y="936" class="label">Gather-scratch DRAM</text>
  <text x="70" y="981" class="label">DRAM reads + NoC</text>
  <text x="70" y="1024" class="label">Compute / output</text>
  <path d="M270 860 H1510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="270" y="855" class="tiny">time →</text>

  <rect x="270" y="873" width="285" height="29" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="412" y="893" class="small" text-anchor="middle">receive/forward remote Aⱼ; send local A</text>
  <rect x="555" y="873" width="285" height="29" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="697" y="893" class="small" text-anchor="middle">receive/forward subsequent remote A blocks</text>
  <text x="870" y="893" class="label">…</text>

  <rect x="350" y="918" width="285" height="29" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="492" y="938" class="small" text-anchor="middle">scatter-write remote Aⱼ tiles</text>
  <rect x="635" y="918" width="285" height="29" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="777" y="938" class="small" text-anchor="middle">scatter-write subsequent remote A tiles</text>
  <text x="950" y="938" class="label">…</text>

  <rect x="430" y="963" width="285" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="572" y="983" class="small" text-anchor="middle">read Aᵣ/gather scratch + B; NoC relay</text>
  <rect x="715" y="963" width="285" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="857" y="983" class="small" text-anchor="middle">read and relay subsequent A/B blocks</text>
  <text x="1030" y="983" class="label">…</text>

  <rect x="510" y="1006" width="250" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="635" y="1026" class="small" text-anchor="middle">matmul K block j</text>
  <rect x="760" y="1006" width="250" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="885" y="1026" class="small" text-anchor="middle">matmul K block j+1</text>
  <text x="1040" y="1026" class="label">…</text>
  <rect x="1320" y="1006" width="170" height="29" rx="5" fill="#e9d5ff" stroke="#7e22ce"/>
  <text x="1405" y="1026" class="small" text-anchor="middle">write after K block 19</text>

