<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<title>V3 DRAM activation all-gather: Two worker groups across four devices</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:26px;font-weight:700}.section{font-size:20px;font-weight:650}.label{font-size:15px;font-weight:600}.small{font-size:14px;fill:#334155}.tiny{font-size:12px;fill:#475569}.panel{fill:white;stroke:#64748b;stroke-width:1.5}.device{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}.pipe{fill:none;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
</defs><rect width="1600" height="840" fill="#f8fafc"/>
<text x="40" y="42" class="title">V3 DRAM activation all-gather: Two worker groups across four devices</text>
<text x="40" y="72" class="small">Two independent all-to-all PipeNets, one per communication-worker coordinate. Each group carries different activation rows.</text>
<rect x="40" y="105" width="740" height="585" rx="10" class="panel"/>
<text x="65" y="138" class="section">Worker 0 at (0, 0) on every device</text>
<text x="65" y="166" class="small">Activation tile rows 4r+0 and 4r+1; all 40 tiles of the device's K shard</text><path d="M300 270 H510" class="pipe" stroke="#2563eb"/><path d="M300 560 H510" class="pipe" stroke="#2563eb"/><path d="M210 320 V510" class="pipe" stroke="#2563eb"/><path d="M600 320 V510" class="pipe" stroke="#2563eb"/><path d="M300 300 L510 530" class="pipe" stroke="#2563eb"/><path d="M510 300 L300 530" class="pipe" stroke="#2563eb"/><rect x="120" y="220" width="180" height="100" rx="8" class="device"/>
<text x="210" y="247" class="label" text-anchor="middle">Device rank 0</text>
<circle cx="210" cy="273" r="8" fill="#2563eb"/>
<text x="210" y="303" class="small" text-anchor="middle">Worker (0, 0)</text><rect x="510" y="220" width="180" height="100" rx="8" class="device"/>
<text x="600" y="247" class="label" text-anchor="middle">Device rank 1</text>
<circle cx="600" cy="273" r="8" fill="#2563eb"/>
<text x="600" y="303" class="small" text-anchor="middle">Worker (0, 0)</text><rect x="120" y="510" width="180" height="100" rx="8" class="device"/>
<text x="210" y="537" class="label" text-anchor="middle">Device rank 2</text>
<circle cx="210" cy="563" r="8" fill="#2563eb"/>
<text x="210" y="593" class="small" text-anchor="middle">Worker (0, 0)</text><rect x="510" y="510" width="180" height="100" rx="8" class="device"/>
<text x="600" y="537" class="label" text-anchor="middle">Device rank 3</text>
<circle cx="600" cy="563" r="8" fill="#2563eb"/>
<text x="600" y="593" class="small" text-anchor="middle">Worker (0, 0)</text><text x="410" y="650" class="small" text-anchor="middle">Every arrow represents both directions: 12 directed pipes per group.</text><rect x="820" y="105" width="740" height="585" rx="10" class="panel"/>
<text x="845" y="138" class="section">Worker 1 at (1, 0) on every device</text>
<text x="845" y="166" class="small">Activation tile rows 4r+2 and 4r+3; all 40 tiles of the device's K shard</text><path d="M1080 270 H1290" class="pipe" stroke="#15803d"/><path d="M1080 560 H1290" class="pipe" stroke="#15803d"/><path d="M990 320 V510" class="pipe" stroke="#15803d"/><path d="M1380 320 V510" class="pipe" stroke="#15803d"/><path d="M1080 300 L1290 530" class="pipe" stroke="#15803d"/><path d="M1290 300 L1080 530" class="pipe" stroke="#15803d"/><rect x="900" y="220" width="180" height="100" rx="8" class="device"/>
<text x="990" y="247" class="label" text-anchor="middle">Device rank 0</text>
<circle cx="990" cy="273" r="8" fill="#15803d"/>
<text x="990" y="303" class="small" text-anchor="middle">Worker (1, 0)</text><rect x="1290" y="220" width="180" height="100" rx="8" class="device"/>
<text x="1380" y="247" class="label" text-anchor="middle">Device rank 1</text>
<circle cx="1380" cy="273" r="8" fill="#15803d"/>
<text x="1380" y="303" class="small" text-anchor="middle">Worker (1, 0)</text><rect x="900" y="510" width="180" height="100" rx="8" class="device"/>
<text x="990" y="537" class="label" text-anchor="middle">Device rank 2</text>
<circle cx="990" cy="563" r="8" fill="#15803d"/>
<text x="990" y="593" class="small" text-anchor="middle">Worker (1, 0)</text><rect x="1290" y="510" width="180" height="100" rx="8" class="device"/>
<text x="1380" y="537" class="label" text-anchor="middle">Device rank 3</text>
<circle cx="1380" cy="563" r="8" fill="#15803d"/>
<text x="1380" y="593" class="small" text-anchor="middle">Worker (1, 0)</text><text x="1190" y="650" class="small" text-anchor="middle">Every arrow represents both directions: 12 directed pipes per group.</text><text x="40" y="728" class="label">Per pipe: Source DRAM shard → L1 send DFB → fabric → destination L1 receive DFB → gathered-A DRAM</text>
<text x="40" y="757" class="small">Four-device placement is shown as 2×2; participants use logical 4×1 ranks. Lines represent logical pipes, not individual physical fabric hops.</text>
<text x="40" y="782" class="small">Both groups run concurrently. Each message contains 2×40 BF16 tiles (160 KiB); the router payload is 8 KiB. Each device also copies its own shard into gathered A.</text>
<text x="40" y="812" class="tiny">Measured configuration: M/K/N=9472/5120/15360; padded M=9984. Source: collectives.py::make_column_all_gather; replicated/operation.py selects two workers.</text>
</svg>
