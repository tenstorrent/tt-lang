  <text x="215" y="744" class="small" text-anchor="middle">Bias initializes FP32 accumulator in L1</text>
  <text x="215" y="758" class="tiny" text-anchor="middle">M/K/N blocks: 8/8/8 tiles; packer accumulation</text>
