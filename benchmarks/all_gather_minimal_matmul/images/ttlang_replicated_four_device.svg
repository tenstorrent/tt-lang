  <text x="800" y="879" class="label" text-anchor="middle">Replicated weights produce replicated output directly; no output all-gather.</text>
  <rect x="40" y="906" width="1520" height="232" class="device"/>
  <text x="65" y="936" class="section">Program sequence and overlap within matmul</text>
  <text x="65" y="958" class="small">Illustrative timeline, not to scale. Fabric gathering and matmul do not overlap in this implementation.</text>
