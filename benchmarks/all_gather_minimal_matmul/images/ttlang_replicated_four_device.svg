  <text x="40" y="278" class="section">Activation all-gather</text>
  <rect x="40" y="294" width="1520" height="96" class="fabric"/>
  <text x="800" y="316" class="label" text-anchor="middle">Two workers/device: Each device sends its K shard directly to all three peers</text>
  <text x="800" y="344" class="small" text-anchor="middle">Read own A shard from DRAM → L1 send DFB → fabric → peer L1 receive DFB → peer gathered-A DRAM</text>
  <text x="800" y="374" class="small" text-anchor="middle">2×40-tile messages · source-device index determines the K offset · gathered A includes own shard and all three remote shards</text>
