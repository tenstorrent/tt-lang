  <rect x="40" y="416" width="350" height="74" class="dram"/>
  <text x="215" y="439" class="label" text-anchor="middle">Device 0: Gathered A in DRAM</text>
  <text x="215" y="460" class="small" text-anchor="middle">[ A₀ | A₁ | A₂ | A₃ ] = padded-M × K</text>
  <text x="215" y="478" class="tiny" text-anchor="middle">9984 padded rows; logical M = 9472</text>
