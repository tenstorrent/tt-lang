<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140" role="img" aria-labelledby="title description">
  <title id="title">V1 TT-Lang per-row all-gather + matmul: Per-device view</title>
  <desc id="description">One participant in a four-device mesh. Activation shards transfer through fabric directly into L1 dataflow buffers. Worker cores cache the full K activation range, stream weight blocks from DRAM, and overlap data movement with matmul.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7e22ce"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <pattern id="worker-grid" width="300" height="70" patternUnits="userSpaceOnUse"><rect width="300" height="70" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/></pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 19px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 650; }
      .small { font-size: 12px; fill: #334155; }
      .tiny { font-size: 11px; fill: #475569; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .dram { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 7; }
      .l1a { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 6; }
      .l1b { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; rx: 6; }
      .l1c { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
      .l1o { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; rx: 6; }
      .fabric { fill: #ffedd5; stroke: #c2410c; stroke-width: 1.5; rx: 6; }
      .route { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="1140" fill="#f8fafc"/>
  <text x="40" y="42" class="title">V1 TT-Lang per-row all-gather + matmul: Per-device view</text>
  <text x="40" y="68" class="subtitle">One participant in a 2×2 four-device mesh · transposed 2×5 worker grid · 2×40×2 tile blocks</text>

  <text x="40" y="106" class="section">Device DRAM tensors and fabric interface</text>
  <rect x="40" y="121" width="1520" height="125" class="box"/>

  <rect x="60" y="143" width="230" height="78" class="dram"/>
  <text x="75" y="167" class="label">Local activation shard</text>
  <text x="75" y="189" class="small">Aᵣ: M × K/4</text>
  <text x="75" y="206" class="tiny">One 2×40-tile block per M block</text>

  <rect x="320" y="143" width="230" height="78" class="dram"/>
  <text x="335" y="167" class="label">Weight shard</text>
  <text x="335" y="189" class="small">Bᵣ: K × N/4</text>
  <text x="335" y="206" class="tiny">Streamed once per output block</text>

  <rect x="580" y="143" width="170" height="78" class="dram"/>
  <text x="595" y="167" class="label">Bias shard</text>
  <text x="595" y="189" class="small">biasᵣ: 1 × N/4</text>
  <text x="595" y="206" class="tiny">Read per N block</text>

  <rect x="780" y="143" width="220" height="78" class="dram"/>
  <text x="795" y="167" class="label">Output shard</text>
  <text x="795" y="189" class="small">Oᵣ: M × N/4</text>
  <text x="795" y="206" class="tiny">One region per worker</text>

  <rect x="1030" y="143" width="230" height="78" class="l1a"/>
  <text x="1045" y="167" class="label">No gathered-A DRAM tensor</text>
  <text x="1045" y="189" class="small">Remote blocks enter L1 DFBs</text>
  <text x="1045" y="206" class="tiny">Cached for later N rounds</text>

  <rect x="1320" y="136" width="210" height="94" class="fabric"/>
  <text x="1335" y="160" class="label">Fabric PipeNet</text>
  <text x="1335" y="182" class="small">Three fabric unicasts per source</text>
  <text x="1335" y="201" class="small">Remote packets enter an L1 DFB</text>
  <text x="1335" y="218" class="tiny">No fabric multicast</text>

  <text x="40" y="296" class="section">Worker dataflow on each device</text>
  <text x="40" y="318" class="small">Forced transpose: x partitions M; y partitions N. All ten worker cores compute.</text>

  <rect x="60" y="362" width="600" height="350" fill="url(#worker-grid)" stroke="#334155" stroke-width="2"/>
  <rect x="60" y="362" width="600" height="70" fill="#bbf7d0" fill-opacity="0.78" stroke="#15803d" stroke-width="1.5"/>
  <rect x="60" y="362" width="300" height="350" fill="#bfdbfe" fill-opacity="0.42" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="360" y="355" class="small" text-anchor="middle">2 M partitions →</text>
  <text x="33" y="537" class="small" text-anchor="middle" transform="rotate(-90 33 537)">5 N partitions →</text>
  <text x="72" y="385" class="tiny">x0,y0</text>
  <text x="472" y="386" class="tiny">A source row: y=0</text>
  <text x="82" y="557" class="tiny" text-anchor="middle" transform="rotate(-90 82 557)">B source column: x=0</text>
  <text x="278" y="520" class="label">All 10 cores compute</text>
  <text x="225" y="542" class="small">Each retains full-K A blocks for its M region</text>
  <path d="M535 397 V674" class="route" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <text x="545" y="532" class="tiny">A block hardware NoC multicast</text>
  <path d="M205 660 H625" class="route" stroke="#1d4ed8" marker-end="url(#arrow-blue)"/>
  <text x="360" y="653" class="tiny">B block NoC transfer</text>

  <path d="M175 221 V270 H24 V397 H58" class="route" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <text x="32" y="286" class="tiny">local A DRAM read</text>
  <path d="M435 221 V278 H14 V660 H58" class="route" stroke="#1d4ed8" marker-end="url(#arrow-blue)"/>
  <text x="18" y="679" class="tiny">weight DRAM read</text>
  <path d="M665 221 V286 H810 V690 H856" class="route" stroke="#475569" marker-end="url(#arrow-gray)"/>
  <text x="800" y="668" class="tiny" text-anchor="end">bias DRAM read</text>
  <path d="M1508 698 H1520 V766 H825 V270 H890 V221" class="route" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>

  <rect x="835" y="340" width="700" height="390" class="box"/>
  <text x="858" y="371" class="section">L1 dataflow buffers on every worker</text>
  <text x="858" y="394" class="small">Four-device BF16 input/output with FP32 intermediate storage.</text>

  <rect x="858" y="414" width="650" height="70" class="fabric"/>
  <text x="874" y="438" class="label">Activation transport · one 2×40 BF16 tile block = 160 KiB</text>
  <text x="874" y="461" class="small">local send: 1 block · remote receive: 3 blocks · NoC multicast staging: 1 block</text>

  <path d="M1530 170 H1565 V449 H1510" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <path d="M1508 470 H1585 V200 H1532" class="route" stroke="#c2410c" marker-end="url(#arrow-orange)"/>

  <rect x="858" y="510" width="300" height="68" class="l1a"/>
  <text x="874" y="534" class="label">Full-K activation cache · depth 4</text>
  <text x="874" y="557" class="small">4 × (2×40 BF16 tiles) = 640 KiB</text>
  <rect x="1208" y="510" width="300" height="68" class="l1b"/>
  <text x="1224" y="534" class="label">Weight DFB · depth 2</text>
  <text x="1224" y="557" class="small">2 × (40×2 BF16 tiles) = 320 KiB</text>

  <path d="M1008 484 V492 H1008 V508" class="route" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path d="M1008 578 V590 H1110 V602" class="route" stroke="#15803d" marker-end="url(#arrow-green)"/>
  <path d="M1358 578 V590 H1260 V602" class="route" stroke="#1d4ed8" marker-end="url(#arrow-blue)"/>

  <rect x="1033" y="604" width="300" height="58" class="l1c"/>
  <text x="1049" y="628" class="label">FP32 accumulator DFBs</text>
  <text x="1049" y="649" class="small">accumulator + biased result · 64 KiB total</text>

  <rect x="858" y="678" width="300" height="40" class="box"/>
  <text x="874" y="703" class="small">BF16 + FP32 bias DFBs · 24 KiB</text>
  <rect x="1208" y="678" width="300" height="40" class="l1o"/>
  <text x="1224" y="703" class="small">BF16 output DFB · 16 KiB</text>
  <path d="M1184 662 V670 H1184 V698 H1206" class="route" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>

  <text x="858" y="748" class="tiny">Declared DFB capacity: 1,864 KiB/worker. Activation cache is reused across N rounds.</text>

  <rect x="40" y="786" width="1520" height="306" class="box"/>
  <text x="65" y="819" class="section">Block streaming and overlap</text>
  <text x="65" y="841" class="small">Conceptual schedule; bar widths are illustrative. Independent data-movement and compute kernels execute concurrently.</text>

  <text x="70" y="892" class="label">Fabric + local A DRAM</text>
  <text x="70" y="942" class="label">L1 cache + NoC multicast + B DRAM</text>
  <text x="70" y="992" class="label">Compute</text>
  <text x="70" y="1042" class="label">Output DRAM write</text>
  <path d="M270 858 H1510" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="270" y="853" class="tiny">time →</text>
  <path d="M1125 866 V1064" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>

  <rect x="270" y="874" width="205" height="29" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="372" y="894" class="small" text-anchor="middle">read local Aᵣ; send to peers</text>
  <rect x="475" y="874" width="205" height="29" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="577" y="894" class="small" text-anchor="middle">receive remote Aₚ into L1</text>
  <rect x="680" y="874" width="205" height="29" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="782" y="894" class="small" text-anchor="middle">receive remote Aᵩ into L1</text>
  <rect x="885" y="874" width="205" height="29" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="987" y="894" class="small" text-anchor="middle">receive remote Aₛ into L1</text>
  <rect x="1160" y="874" width="330" height="29" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1325" y="894" class="small" text-anchor="middle">later N round: no activation fabric or DRAM traffic</text>

  <rect x="350" y="924" width="205" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="452" y="944" class="small" text-anchor="middle">cache/relay A₀; stream B₀</text>
  <rect x="555" y="924" width="205" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="657" y="944" class="small" text-anchor="middle">cache/relay A₁; stream B₁</text>
  <rect x="760" y="924" width="205" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="862" y="944" class="small" text-anchor="middle">cache/relay A₂; stream B₂</text>
  <rect x="965" y="924" width="125" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="1027" y="944" class="small" text-anchor="middle">A₃ + B₃</text>
  <rect x="1160" y="924" width="330" height="29" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="1325" y="944" class="small" text-anchor="middle">republish cached A₀…A₃; stream next B blocks</text>

  <rect x="430" y="974" width="205" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="532" y="994" class="small" text-anchor="middle">matmul K block 0</text>
  <rect x="635" y="974" width="205" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="737" y="994" class="small" text-anchor="middle">matmul K block 1</text>
  <rect x="840" y="974" width="125" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="902" y="994" class="small" text-anchor="middle">K block 2</text>
  <rect x="965" y="974" width="125" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="1027" y="994" class="small" text-anchor="middle">K block 3</text>
  <rect x="1200" y="974" width="250" height="29" rx="5" fill="#f3e8ff" stroke="#7e22ce"/>
  <text x="1325" y="994" class="small" text-anchor="middle">matmul with cached A and next B</text>

  <rect x="970" y="1024" width="120" height="28" rx="5" fill="#e9d5ff" stroke="#7e22ce"/>
  <text x="1030" y="1043" class="small" text-anchor="middle">write N block</text>
  <rect x="1360" y="1024" width="130" height="28" rx="5" fill="#e9d5ff" stroke="#7e22ce"/>
  <text x="1425" y="1043" class="small" text-anchor="middle">write next block</text>

  <text x="40" y="1120" class="tiny">Source: tt-lang branch bnorris/all-gather-minimal-matmul · examples/all_gather_minimal_matmul/operation.py · four-device M=3072, K=5120 example</text>
</svg>
