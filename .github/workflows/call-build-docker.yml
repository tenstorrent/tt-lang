name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      ttlang_sha_override:
        description: "tt-lang SHA/branch override (optional, defaults to current commit)"
        type: string
        required: false
      push:
        description: "Push built images to GHCR. Leave false to build and smoke-test locally only."
        type: boolean
        default: false
  workflow_call:
    inputs:
      ttlang_sha_override:
        description: "tt-lang SHA/branch override (optional, defaults to current commit)"
        type: string
        required: false
      push:
        description: "Push built images to GHCR. Set true only when downstream jobs require a registry-visible image."
        type: boolean
        default: false
    outputs:
      docker-image:
        description: "Built Docker image name with tag"
        value: ${{ jobs.build-images.outputs.docker-image }}
      docker-image-base:
        description: "Base Docker image name with tag"
        value: ${{ jobs.build-image-base.outputs.docker-image-base }}
      docker-tag:
        description: "Docker tag used for the built IRD image"
        value: ${{ jobs.build-images.outputs.docker-tag }}

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  configure-deps:
    uses: ./.github/workflows/call-build-toolchain.yml

  # Builds the base image (system deps, Python, Clang)
  build-image-base:
    if: ${{ inputs.push }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      docker-image-base: ${{ steps.build.outputs.docker-image-base }}

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ttlang_sha_override || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build base Docker image
        id: build
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_STEP_LOG_MAX_SIZE: -1
          PUSH: ${{ inputs.push }}
        run: |
          set -o pipefail
          set -x
          FLAGS=()
          if [ "$PUSH" != "true" ]; then
              FLAGS+=(--no-push)
          fi
          .github/containers/build-docker-images.sh --image-type base "${FLAGS[@]}" | tee docker.log

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "ERROR: Docker build failed"
            exit 1
          fi

          DOCKER_IMAGE_BASE="$(cat .docker-image-base)"
          echo "docker-image-base=$DOCKER_IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "Base image built successfully: $DOCKER_IMAGE_BASE"

  # Builds LLVM + tt-metal on the host (via docker run with base image),
  # then packages dist and ird Docker images.
  build-images:
    needs: [build-image-base, configure-deps]
    if: ${{ !cancelled() && needs.configure-deps.result == 'success' && (needs.build-image-base.result == 'success' || needs.build-image-base.result == 'skipped') }}
    runs-on: mlir-large-runner-lang
    timeout-minutes: 360

    outputs:
      docker-image: ${{ steps.build-dist.outputs.docker-image }}
      docker-tag: ${{ steps.docker-tag.outputs.docker-tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ttlang_sha_override || github.sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Free up some more space
        run: .github/scripts/cleanup-ci-space.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Fix git safe directory for submodules
        run: git config --global --add safe.directory '*'

      - name: Extract Docker tag
        id: docker-tag
        run: |
          DOCKER_TAG="$(.github/containers/get-version-tag.sh)"
          echo "docker-tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "Docker tag: $DOCKER_TAG"

      - name: Prepare toolchain directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/ttlang-toolchain

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: /opt/ttlang-toolchain
          key: ${{ needs.configure-deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Patch missing runtime artifacts and tt-triage into cached toolchain
        run: |
          bash scripts/copy-ttmetal-runtime-artifacts.sh third-party/tt-metal /opt/ttlang-toolchain
          rm -rf /opt/ttlang-toolchain/tt-metal/tools/triage
          install -d /opt/ttlang-toolchain/tt-metal/tools
          cp -a third-party/tt-metal/tools/triage /opt/ttlang-toolchain/tt-metal/tools/
          install -m 755 bin/tt-triage /opt/ttlang-toolchain/bin/tt-triage

      - name: Pull base image
        run: |
          # When push: true, build-image-base just pushed at this tag.
          # When push: false, we pull the existing base image at the same
          # tag (released images already exist at clean tags; dryrun only
          # runs when the resolved tag already points at an existing image).
          BASE_IMAGE="ghcr.io/${{ github.repository }}/tt-lang-base-ubuntu-24-04:${{ steps.docker-tag.outputs.docker-tag }}"
          .github/scripts/pull-image-retry.sh "$BASE_IMAGE"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Configure tt-lang
        run: |
          df -h
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /opt/ttlang-toolchain:/opt/ttlang-toolchain \
            -w /workspace \
            -e TTLANG_TOOLCHAIN_DIR=/opt/ttlang-toolchain \
            "$BASE_IMAGE" \
            bash scripts/build-and-install.sh --configure-only
          echo "=== Configure complete ==="
          df -h

      - name: Normalize toolchain
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /opt/ttlang-toolchain:/opt/ttlang-toolchain \
            -w /workspace \
            "$BASE_IMAGE" \
            bash -c "
              bash .github/scripts/normalize-toolchain-install.sh /opt/ttlang-toolchain
              bash .github/containers/cleanup-toolchain.sh /opt/ttlang-toolchain
            "

      - name: Clean up Docker build cache before ird image build
        run: |
          docker builder prune -af || true
          df -h

      # The ird image captures the toolchain WITHOUT the freshly built tt-lang,
      # so it must be built before "Build + install tt-lang" installs tt-lang
      # into /opt. Building it directly from /opt here (instead of snapshotting
      # /opt to a directory with cp -a) avoids a full second copy of the
      # multi-GB toolchain on disk during the dist image build. dist-toolchain
      # is unused when targeting ird but must be a valid path.
      - name: Build ird Docker image (local only)
        id: build-ird
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_STEP_LOG_MAX_SIZE: -1
          DOCKER_BUILD_EXTRA_ARGS: "--build-context dist-toolchain=/opt/ttlang-toolchain --build-context ird-toolchain=/opt/ttlang-toolchain"
        run: |
          set -o pipefail
          set -x
          .github/containers/build-docker-images.sh --image-type ird --no-push | tee docker-ird.log

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "ERROR: Docker build failed"
            exit 1
          fi

          LOCAL_IMAGE="$(cat .docker-image-ird)"
          REGISTRY_IMAGE="ghcr.io/tenstorrent/tt-lang/${LOCAL_IMAGE}"
          echo "local-image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "docker-image=$REGISTRY_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IRD image built locally: $LOCAL_IMAGE"
          df -h

      - name: Smoke-test ird image
        run: |
          set -e
          docker run --rm "${{ steps.build-ird.outputs.local-image }}" bash -c '
            set -e
            export PATH=/opt/ttlang-toolchain/venv/bin:/opt/ttlang-toolchain/bin:$PATH
            mlir-opt --version
            FileCheck --version
            python3 --version
            tt-triage --help
            prted --version
          '
          docker run --rm --user 1001:1001 \
            "${{ steps.build-ird.outputs.local-image }}" bash -c '
            set -e
            export HOME=/home/user
            export PATH=/opt/ttlang-toolchain/venv/bin:/opt/ttlang-toolchain/bin:$PATH
            export TT_METAL_HOME=/opt/ttlang-toolchain/tt-metal
            export TT_METAL_RUNTIME_ROOT=$TT_METAL_HOME
            export PYTHONPATH=$TT_METAL_HOME/python_packages/ttnn:$TT_METAL_HOME/python_packages/tools
            export LD_LIBRARY_PATH=$TT_METAL_HOME/lib:${LD_LIBRARY_PATH:-}
            test "$(id -u)" = 1001
            test -w "$TT_METAL_HOME/build/profiler/build_wasm/traces"
            test -w "$TT_METAL_HOME/generated/profiler"
            prted --version
            python3 -c "import ttnn"
          '

      # Push after the ird smoke test so the local image can be removed before
      # the larger dist build. Keeping it until the dist smoke test would
      # retain both image layer sets and raise the peak disk requirement.
      - name: Push ird image to GHCR
        if: ${{ inputs.push }}
        run: |
          set -e
          LOCAL="${{ steps.build-ird.outputs.local-image }}"
          REGISTRY="${{ steps.build-ird.outputs.docker-image }}"
          docker tag "$LOCAL" "$REGISTRY"
          docker push "$REGISTRY"

      - name: Push ird image to GHCR as :latest
        if: ${{ inputs.push && github.ref == 'refs/heads/main' }}
        run: |
          set -e
          LOCAL="${{ steps.build-ird.outputs.local-image }}"
          REGISTRY="${{ steps.build-ird.outputs.docker-image }}"
          LATEST="${REGISTRY%:*}:latest"
          docker tag "$LOCAL" "$LATEST"
          docker push "$LATEST"

      - name: Remove local ird image to free space
        run: |
          # Remove by image ID so all tags (local, registry, :latest) are
          # dropped; removing only the local tag would leave the layers
          # referenced by the pushed tags and free nothing.
          ird_iid="$(docker images -q "${{ steps.build-ird.outputs.local-image }}")"
          if [ -n "$ird_iid" ]; then
            docker rmi -f "$ird_iid" || true
          fi
          docker builder prune -af || true
          df -h

      - name: Build + install tt-lang
        run: |
          echo "=== Building tt-lang ==="
          df -h
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /opt/ttlang-toolchain:/opt/ttlang-toolchain \
            -w /workspace \
            -e TTLANG_TOOLCHAIN_DIR=/opt/ttlang-toolchain \
            "$BASE_IMAGE" \
            bash scripts/build-and-install.sh --build-and-install
          echo "=== tt-lang build complete ==="
          df -h

      - name: Cleanup dist toolchain
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /opt/ttlang-toolchain:/opt/ttlang-toolchain \
            -w /workspace \
            "$BASE_IMAGE" \
            bash .github/containers/cleanup-toolchain.sh /opt/ttlang-toolchain --dist

      - name: Clean up build dirs to free space before Docker build
        run: |
          echo "Removing build directories..."
          sudo rm -rf build
          df -h

      - name: Clean up Docker before packaging
        run: |
          # Prune build cache and dangling layers but keep tagged images so the
          # base image survives for the dist build; system prune -a would delete
          # it and force a no-retry GHCR re-pull.
          docker builder prune -af || true
          docker image prune -f || true
          df -h

      - name: Build dist Docker image (local only)
        id: build-dist
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_STEP_LOG_MAX_SIZE: -1
          DOCKER_BUILD_EXTRA_ARGS: "--build-context dist-toolchain=/opt/ttlang-toolchain --build-context ird-toolchain=/opt/ttlang-toolchain"
        run: |
          set -o pipefail
          set -x
          .github/containers/build-docker-images.sh --image-type dist --no-push | tee docker.log

          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "ERROR: Docker build failed"
            exit 1
          fi

          LOCAL_IMAGE="$(cat .docker-image-name)"
          REGISTRY_IMAGE="ghcr.io/tenstorrent/tt-lang/${LOCAL_IMAGE}"
          echo "local-image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "docker-image=$REGISTRY_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Dist image built locally: $LOCAL_IMAGE"
          df -h

      - name: Smoke-test dist image
        run: |
          set -e
          docker run --rm "${{ steps.build-dist.outputs.local-image }}" bash -c '
            set -e
            export PATH=/opt/ttlang-toolchain/venv/bin:/opt/ttlang-toolchain/bin:$PATH
            tt-lang-sim --help
            tt-lang-sim-stats --help
            tt-triage --help
          '

      - name: Push dist image to GHCR
        if: ${{ inputs.push }}
        run: |
          set -e
          LOCAL="${{ steps.build-dist.outputs.local-image }}"
          REGISTRY="${{ steps.build-dist.outputs.docker-image }}"
          docker tag "$LOCAL" "$REGISTRY"
          docker push "$REGISTRY"

      - name: Push dist image to GHCR as :latest
        if: ${{ inputs.push && github.ref == 'refs/heads/main' }}
        run: |
          set -e
          LOCAL="${{ steps.build-dist.outputs.local-image }}"
          REGISTRY="${{ steps.build-dist.outputs.docker-image }}"
          LATEST="${REGISTRY%:*}:latest"
          docker tag "$LOCAL" "$LATEST"
          docker push "$LATEST"

      - name: Clean up Docker after build
        if: always()
        run: |
          docker builder prune -af || true
          df -h

      - name: Show disk usage on failure
        if: failure()
        run: |
          echo "=== Disk Usage ==="
          df -h
          echo ""
          echo "=== Toolchain size (largest consumer, outside the workspace) ==="
          du -sh /opt/ttlang-toolchain 2>/dev/null || true
          echo ""
          echo "=== Disk Usage by Directory ==="
          du -h --max-depth=2 ${{ github.workspace }} 2>/dev/null | sort -hr | head -20 || true
          echo ""
          echo "=== Docker Disk Usage ==="
          docker system df || true

      # Runs after "Show disk usage on failure" so the toolchain is still on
      # disk for that diagnostic. Self-hosted-runner hygiene: /opt persists
      # across jobs otherwise.
      - name: Remove toolchain to free space
        if: always()
        run: |
          sudo rm -rf /opt/ttlang-toolchain || true
          df -h
