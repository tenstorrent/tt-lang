name: Pre-commit

on:
  workflow_dispatch:
  workflow_call:

jobs:
  pre-commit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          TTLANG_PUBLIC_DIFF_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
