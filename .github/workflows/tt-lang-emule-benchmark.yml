name: Run the compiler test inventory on runner-local tt-emule

on:
  workflow_dispatch:
    inputs:
      owner_approval_recorded:
        description: Owner approval for runner-local builds and possible public logs is recorded
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: emule-hosted-experiment
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      inputs.owner_approval_recorded &&
      github.repository == 'tenstorrent/tt-lang' &&
      github.ref == 'refs/heads/kostas/tt-lang-emule-hosted-ci-experiment'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify the reviewed candidate and configured source
        env:
          SELECTED_SHA: ${{ github.sha }}
          APPROVED_SHA: ${{ vars.TTLANG_EMULE_APPROVED_SHA }}
          SOURCE_REPOSITORY: ${{ vars.TTLANG_EMULE_SOURCE_REPOSITORY }}
        run: |
          if [[ ! "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$SELECTED_SHA" != "$APPROVED_SHA" ]] ||
             [[ ! "$SOURCE_REPOSITORY" =~ ^tenstorrent/[A-Za-z0-9_.-]+$ ]]; then
            echo 'No matching reviewed candidate/source configuration is available.' >&2
            exit 2
          fi

  serial:
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: compiler
    env:
      TTLANG_EMULE_IMAGE: ttlang-emule-ci:runner-local
    steps:
      - name: Checkout the reviewed compiler revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: compiler
          fetch-depth: 0
          persist-credentials: false

      - name: Read the pinned emulator revision
        id: stack
        run: |
          python3 scripts/tt-lang-emule-stack.py \
            --manifest config/tt-lang-emule-stack.json validate \
            --compiler-source . --quiet
          pin="$(python3 scripts/tt-lang-emule-stack.py \
            --manifest config/tt-lang-emule-stack.json emit |
            awk -F '\t' '$1 == "TTLANG_EMULE_COMMIT" {print $2}')"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          printf 'emulator_sha=%s\n' "$pin" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned private source without retaining credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ vars.TTLANG_EMULE_SOURCE_REPOSITORY }}
          ref: ${{ steps.stack.outputs.emulator_sha }}
          token: ${{ secrets.TTLANG_EMULE_SOURCE_READ_TOKEN }}
          path: private-runtime
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify sources and absence of retained checkout credentials
        run: |
          for source in "$GITHUB_WORKSPACE/compiler" "$GITHUB_WORKSPACE/private-runtime"; do
            if git -C "$source" config --local --get-regexp \
              '^(http\..*\.extraheader|credential\..*|core\.sshcommand|include\.path)$' \
              > /dev/null; then
              echo 'A checkout retains authentication configuration.' >&2
              exit 2
            else
              status=$?
              test "$status" -eq 1
            fi
          done
          python3 scripts/tt-lang-emule-stack.py \
            --manifest config/tt-lang-emule-stack.json validate \
            --compiler-source . --emulator-source "$GITHUB_WORKSPACE/private-runtime" --quiet

      - name: Measure the cold runner-local runtime build
        timeout-minutes: 120
        env:
          TTLANG_EMULE_BUILD_ONLY: "1"
          TTLANG_EMULE_REBUILD: "1"
          TTLANG_EMULE_RUNTIME_SOURCE_DIR: ${{ github.workspace }}/private-runtime
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        run: |
          started=$SECONDS
          trap 'status=$?; printf "Runtime build: exit=%s seconds=%s\n" "$status" "$((SECONDS - started))"; df -Pk "$RUNNER_TEMP"' EXIT
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          test "$available_kib" -ge 2097152
          timeout --signal=TERM --kill-after=30s 6900 \
            bash scripts/tt-lang-emule-container.sh

      - name: Run the complete compiler test inventory serially with fresh caches
        timeout-minutes: 230
        run: |
          python3 scripts/emule-ci/worker.py --image "$TTLANG_EMULE_IMAGE" \
            --worker serial --output "$RUNNER_TEMP/emule-serial" \
            --cpus 4 --memory-gib 12 --disk-floor-gib 2 --timeout-seconds 13200

      - name: Report the public per-suite summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/emule-serial/summary.json"
          if [[ -f "$summary" ]]; then
            python3 scripts/emule-ci/worker.py --report-summary "$summary" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'The worker produced no summary.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
