name: Hardware Tests

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: 'Hardware type to run on'
        required: false
        type: string
        default: 'n150'
      build-os:
        description: 'Which build artifacts to use (ubuntu or macos)'
        required: false
        type: string
        default: 'ubuntu'
      timeout:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30
  workflow_call:
    inputs:
      runs-on:
        description: 'Hardware type to run on'
        required: false
        type: string
        default: 'n150'
      build-os:
        description: 'Which build artifacts to use (ubuntu or macos)'
        required: false
        type: string
        default: 'ubuntu'
      timeout:
        description: 'Job timeout in minutes'
        required: false
        type: number
        default: 30

permissions:
  checks: write
  contents: read

jobs:
  test-n150:
    name: "Hardware Tests (${{ inputs.runs-on }})"
    runs-on: ${{ format('tt-ubuntu-2204-{0}-stable', inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout }}

    container:
      image: ghcr.io/tenstorrent/tt-lang/tt-lang-ird-ubuntu-22-04:latest
      options: --device /dev/tenstorrent
      volumes:
        - /dev/hugepages:/dev/hugepages
        - /dev/hugepages-1G:/dev/hugepages-1G
        - /etc/udev/rules.d:/etc/udev/rules.d
        - /lib/modules:/lib/modules

    defaults:
      run:
        shell: bash

    env:
      RUNS_ON: ${{ inputs.runs-on }}
      PYTHONDONTWRITEBYTECODE: 1
      TTLANG_TEST_SEED: 42

    steps:
      - name: Checkout tt-lang
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Git safe directory
        run: git config --global --add safe.directory "$(pwd)"

      - name: Download build artifacts archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ format('ttlang-build-{0}', inputs.build-os) }}
          path: .

      - name: Extract build artifacts
        run: |
          set -x
          ARTIFACT_FILE=$(.github/scripts/get-artifact-archive-name.sh "${{ github.sha }}")
          tar -I 'zstd --long=31' -xf "${ARTIFACT_FILE}"
          rm -f "${ARTIFACT_FILE}"

      - name: Fix activate paths for container
        run: |
          echo "=== Before fix ==="
          echo "Container workspace: $(pwd)"
          grep -E 'PYTHONPATH|CMAKE_BINARY|TT_LANG_HOME' build/env/activate | head -10
          echo ""
          .github/scripts/fix-activate-paths.sh
          echo ""
          echo "=== After fix ==="
          grep -E 'PYTHONPATH|CMAKE_BINARY|TT_LANG_HOME' build/env/activate | head -10

      - name: Install test dependencies
        run: |
          source build/env/activate
          echo "PYTHONPATH=$PYTHONPATH"
          echo "PATH=$PATH"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          which python3
          python3 -c "import sys; print('sys.path:', sys.path[:5])"
          pip install -r dev-requirements.txt

      - name: Smoketest
        run: |
          source build/env/activate
          echo "Verifying ttl import..."
          python3 -c "import ttl; print('ttl location:', ttl.__file__)"
          python3 test/python/smoketest.py

      - name: Single test (just python)
        run: |
          source build/env/activate
          python test/python/simple_add.py

      - name: Python lit tests
        run: |
          source build/env/activate
          cmake --build build --target check-ttlang-python-lit

      - name: ME2E tests (MLIR input end-to-end tests)
        run: |
          source build/env/activate
          python3 -m pytest test/me2e -v --tb=short --junitxml=build/test/me2e-report.xml

      - name: Pytests (Python DSL end-to-end tests)
        run: |
          source build/env/activate
          python3 -m pytest test/python -v --tb=long --junitxml=build/test/pytest-report.xml

      - name: Simulator tests
        run: |
          source build/env/activate
          python3 -m pytest test/sim -v --tb=short --junitxml=build/test/sim-report.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-test-reports-${{ inputs.runs-on }}
          path: |
            build/test/python-lit-report.xml
            build/test/me2e-report.xml
            build/test/pytest-report.xml
            build/test/sim-report.xml
          retention-days: 7
