name: Build tt-lang

on:
    workflow_dispatch:
        inputs:
            build_docs:
                description: "Build and deploy documentation."
                type: boolean
                default: false
            run_galaxy_tests:
                description: "Run hardware tests on a shared Exabox Galaxy."
                type: boolean
                default: false
            run_loudbox_tests:
                description: "Run hardware tests on the Blackhole loudbox."
                type: boolean
                default: false
            docker_tag:
                description: "Docker image tag for the ird container."
                type: string
                required: true
    workflow_call:
        inputs:
            build_docs:
                description: "Build and deploy documentation."
                type: boolean
                required: false
                default: false
            run_galaxy_tests:
                description: "Run hardware tests on a shared Exabox Galaxy."
                type: boolean
                required: false
                default: false
            run_loudbox_tests:
                description: "Run hardware tests on the Blackhole loudbox."
                type: boolean
                required: false
                default: false
            docker_tag:
                description: "Docker image tag for the ird container."
                type: string
                required: true

permissions:
    actions: read
    checks: write
    contents: read
    packages: read

jobs:
    build-tt-lang:
        name: "Build and test tt-lang"
        runs-on: ubuntu-24.04
        timeout-minutes: 60

        container:
            image: ghcr.io/tenstorrent/tt-lang/tt-lang-ird-ubuntu-24-04:${{ inputs.docker_tag }}

        defaults:
            run:
                shell: bash

        steps:
            - name: Checkout tt-lang
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1

            - name: Fix git safe directory for submodules
              run: git config --global --add safe.directory '*'

            - name: Set extra CMake options
              if: inputs.build_docs
              run: echo "CMAKE_EXTRA_CONFIG_OPTIONS=-DTTLANG_ENABLE_DOCS=ON" >> "$GITHUB_ENV"

            - name: Configure tt-lang
              run: |
                  cmake_args=(
                      -G Ninja
                      -B build
                      -DCMAKE_BUILD_TYPE=Release
                      -DTTLANG_USE_TOOLCHAIN=ON
                      -DTTLANG_ENABLE_PERF_TRACE=ON
                  )
                  if [ -n "${CMAKE_EXTRA_CONFIG_OPTIONS:-}" ]; then
                      read -r -a extra_cmake_options <<< "$CMAKE_EXTRA_CONFIG_OPTIONS"
                      cmake_args+=("${extra_cmake_options[@]}")
                  fi
                  cmake "${cmake_args[@]}"

            - name: Setup ccache
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: Linux-ttlang-build
                  max-size: 200M

            - name: Build tt-lang
              run: |
                  source build/env/activate
                  cmake --build build

            - name: Smoketest
              run: |
                  source build/env/activate
                  python test/python/smoketest.py

            - name: Run ttlang Lit MLIR tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-mlir

            - name: Run ttlang Python bindings tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-python-bindings

            - name: Run ttlang packaging tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-packaging

            - name: Python lit tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-python-lit

            - name: Build documentation
              if: inputs.build_docs
              run: |
                  source build/env/activate
                  cmake --build build --target ttlang-docs

            - name: Upload documentation artifact
              if: inputs.build_docs
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./build/docs/sphinx/_build/html

    test-hardware:
        strategy:
            fail-fast: false
            matrix:
                hardware: ${{ inputs.run_loudbox_tests && fromJSON('["n150","bh-loudbox-viommu"]') || fromJSON('["n150"]') }}
        uses: ./.github/workflows/call-test-hardware.yml
        secrets: inherit
        with:
            defer_result_check: ${{ matrix.hardware != 'bh-loudbox-viommu' }}
            hardware: ${{ matrix.hardware }}
            runner_label: ${{ matrix.hardware == 'bh-loudbox-viommu' && 'tt-ubuntu-2204-bh-loudbox-viommu-stable' || 'tt-ubuntu-2204-n150-stable' }}
            timeout: 90
            docker_tag: ${{ inputs.docker_tag }}

    test-exabox:
        if: ${{ inputs.run_galaxy_tests }}
        uses: ./.github/workflows/call-test-exabox.yml
        secrets: inherit
        with:
            defer_result_check: true
            timeout: 90
            docker_tag: ${{ inputs.docker_tag }}

    report-skipped-galaxy:
        name: "Report skipped Galaxy hardware tests"
        if: ${{ !inputs.run_galaxy_tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - name: Report skipped tests
              run: echo "::warning::Exabox Galaxy hardware tests are disabled for this workflow run."

    check-hardware:
        name: "Check aggregate hardware result"
        needs: [test-hardware, test-exabox]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5

        steps:
            - name: Checkout tt-lang
              uses: actions/checkout@v6
              with:
                  fetch-depth: 1
                  submodules: false

            - name: Check hardware job results
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -o pipefail
                  gh api --paginate \
                      "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" |
                      python3 .github/scripts/check-hardware-job-results.py \
                          --expected-job-count "${{ inputs.run_loudbox_tests && (inputs.run_galaxy_tests && 3 || 2) || (inputs.run_galaxy_tests && 2 || 1) }}"
