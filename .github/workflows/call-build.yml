name: Build tt-lang

on:
    workflow_dispatch:
        inputs:
            build_docs:
                description: "Build and deploy documentation."
                type: boolean
                default: false
    workflow_call:
        inputs:
            build_docs:
                description: "Build and deploy documentation."
                type: boolean
                required: false
                default: false

permissions:
    checks: write
    contents: read

jobs:
    configure-deps:
        name: "Configure dependencies"
        runs-on: ubuntu-22.04
        timeout-minutes: 360

        defaults:
            run:
                shell: bash

        env:
            CMAKE_BUILD_PARALLEL_LEVEL: 2

        steps:
            - name: Maximize space
              uses: tenstorrent/tt-github-actions/.github/actions/maximize_space@main

            - name: Checkout tt-lang
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      libhwloc-dev libyaml-cpp-dev libboost-all-dev \
                      libtbb-dev libcapstone-dev \
                      cmake ninja-build ccache pkg-config \
                      python3-venv python3-dev \
                      wget zstd

            - name: Setup Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install Clang 17
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod u+x llvm.sh
                  sudo ./llvm.sh 17
                  sudo apt-get install -y libc++-17-dev libc++abi-17-dev
                  sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
                  sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
                  rm -f llvm.sh

            - name: Fix git safe directory for submodules
              run: git config --global --add safe.directory '*'

            - name: Prepare toolchain directory
              run: sudo install -d -o $(id -u) -g $(id -g) /opt/ttlang-toolchain

            - name: Extract submodule SHAs for cache keys
              id: submodule-shas
              run: |
                  echo "llvm-sha=$(git -C third-party/llvm-project rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
                  echo "ttmetal-sha=$(git -C third-party/tt-metal rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

            - name: Restore toolchain cache
              id: cache-toolchain
              uses: actions/cache/restore@v4
              with:
                  path: /opt/ttlang-toolchain
                  key: Linux-toolchain_llvm-${{ steps.submodule-shas.outputs.llvm-sha }}_ttmetal-${{ steps.submodule-shas.outputs.ttmetal-sha }}

            - name: Configure (builds LLVM + tt-metal on cache miss)
              run: |
                  cmake -G Ninja -B build \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DLLVM_INSTALL_DIR=/opt/ttlang-toolchain \
                      -DTTMETAL_BUILD_DIR=/opt/ttlang-toolchain/tt-metal \
                      -DTTLANG_ENABLE_PERF_TRACE=ON

            - name: Save toolchain cache
              if: steps.cache-toolchain.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: /opt/ttlang-toolchain
                  key: Linux-toolchain_llvm-${{ steps.submodule-shas.outputs.llvm-sha }}_ttmetal-${{ steps.submodule-shas.outputs.ttmetal-sha }}

    build-tt-lang:
        name: "Build and test tt-lang"
        needs: configure-deps
        runs-on: ubuntu-22.04
        timeout-minutes: 60

        defaults:
            run:
                shell: bash

        steps:
            - name: Maximize space
              uses: tenstorrent/tt-github-actions/.github/actions/maximize_space@main

            - name: Checkout tt-lang
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0

            - name: Setup Python 3.12
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      libhwloc-dev libyaml-cpp-dev libboost-all-dev \
                      libtbb-dev libcapstone-dev \
                      cmake ninja-build ccache pkg-config \
                      python3-venv python3-dev \
                      wget zstd

            - name: Install Clang 17
              run: |
                  wget https://apt.llvm.org/llvm.sh
                  chmod u+x llvm.sh
                  sudo ./llvm.sh 17
                  sudo apt-get install -y libc++-17-dev libc++abi-17-dev
                  sudo ln -sf /usr/bin/clang-17 /usr/bin/clang
                  sudo ln -sf /usr/bin/clang++-17 /usr/bin/clang++
                  rm -f llvm.sh

            - name: Fix git safe directory for submodules
              run: git config --global --add safe.directory '*'

            - name: Prepare toolchain directory
              run: sudo install -d -o $(id -u) -g $(id -g) /opt/ttlang-toolchain

            - name: Extract submodule SHAs for cache keys
              id: submodule-shas
              run: |
                  echo "llvm-sha=$(git -C third-party/llvm-project rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
                  echo "ttmetal-sha=$(git -C third-party/tt-metal rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

            - name: Restore toolchain cache
              id: cache-toolchain
              uses: actions/cache/restore@v4
              with:
                  path: /opt/ttlang-toolchain
                  key: Linux-toolchain_llvm-${{ steps.submodule-shas.outputs.llvm-sha }}_ttmetal-${{ steps.submodule-shas.outputs.ttmetal-sha }}
                  fail-on-cache-miss: true

            - name: Configure tt-lang
              run: |
                  cmake -G Ninja -B build \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DLLVM_INSTALL_DIR=/opt/ttlang-toolchain \
                      -DTTMETAL_BUILD_DIR=/opt/ttlang-toolchain/tt-metal \
                      -DTTLANG_ENABLE_PERF_TRACE=ON

            - name: Setup ccache
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: Linux-ttlang-build
                  max-size: 200M

            - name: Build tt-lang
              run: |
                  source build/env/activate
                  cmake --build build

            - name: Smoketest
              run: |
                  source build/env/activate
                  python test/python/smoketest.py

            - name: Run ttlang Lit MLIR tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-mlir

            - name: Run ttlang Python bindings tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-python-bindings

            - name: Python lit tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-python-lit

            - name: Build documentation
              if: inputs.build_docs
              run: |
                  source build/env/activate
                  cmake --build build --target ttlang-docs

            - name: Upload documentation artifact
              if: inputs.build_docs
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./build/docs/sphinx/_build/html

            - name: Archive build artifacts
              run: |
                  set -x
                  ARTIFACT_NAME=$(.github/scripts/get-artifact-archive-name.sh "${{ github.sha }}")
                  echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

                  tar -I 'zstd --long=31 --adapt=min=9 -T0' -cf "${ARTIFACT_NAME}" \
                      --exclude='build/llvm-build' \
                      build/

            - name: Upload build artifacts for hardware tests
              uses: actions/upload-artifact@v4
              with:
                  name: ttlang-build-ubuntu
                  path: ${{ env.ARTIFACT_NAME }}
                  if-no-files-found: error
                  retention-days: 1

    test-hardware:
        needs: build-tt-lang
        if: always() && needs.build-tt-lang.result == 'success'
        uses: ./.github/workflows/call-test-hardware.yml
        secrets: inherit
        with:
            runs-on: n150
            build-os: ubuntu
            timeout: 60
