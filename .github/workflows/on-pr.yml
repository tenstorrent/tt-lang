name: On PR

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]

permissions:
  checks: write
  pull-requests: write
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    uses: ./.github/workflows/call-pre-commit.yml
    secrets: inherit

  check-tt-metal-version:
    name: Verify tt-metal version (third-party/tt-metal-version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - run: .github/scripts/check-tt-metal-version.sh

  resolve-docker-tag:
    name: Resolve docker tag for this branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker_tag: ${{ steps.resolve.outputs.docker_tag }}
      needs_rebuild: ${{ steps.probe.outputs.needs_rebuild }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
      - name: Compute tag
        id: resolve
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          TAG=$(.github/containers/get-version-tag.sh)
          if [[ "$TAG" == *-uplift-* && -n "$HEAD_REPO" && "$HEAD_REPO" != "$BASE_REPO" ]]; then
              echo "::error::Uplift PRs from forks are not supported."
              echo "  Resolved tag: $TAG (uplift form)"
              echo "  PR head: $HEAD_REPO; base: $BASE_REPO"
              echo "  A tt-lang maintainer must land this branch into the org repo before CI can build the new toolchain image."
              exit 1
          fi
          echo "docker_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved docker tag: $TAG"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Probe GHCR for image
        id: probe
        run: |
          TAG="${{ steps.resolve.outputs.docker_tag }}"
          IMAGE="ghcr.io/tenstorrent/tt-lang/tt-lang-ird-ubuntu-22-04:${TAG}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Image exists: $IMAGE"
          else
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Image missing: $IMAGE (will rebuild)"
          fi

  build-docker:
    needs: resolve-docker-tag
    if: ${{ needs.resolve-docker-tag.outputs.needs_rebuild == 'true' }}
    permissions:
      contents: read
      packages: write
      checks: write
    uses: ./.github/workflows/call-build-docker.yml
    secrets: inherit

  changes:
    name: Detect wheel/container-affecting changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wheel_or_container: ${{ steps.diff.outputs.wheel_or_container }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false
      - id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$BASE" || -z "$HEAD" ]]; then
            # schedule / workflow_dispatch: no PR diff; run the dist-tutorial
            # nightly safety check unconditionally.
            echo "wheel_or_container=true" >> "$GITHUB_OUTPUT"
            echo "No PR context; running dist tutorials as nightly safety check."
            exit 0
          fi
          PATHS=(
            ".github/containers/Dockerfile"
            ".github/containers/Dockerfile.base"
            ".github/scripts/run-tutorials.sh"
            ".github/scripts/smoke-test-wheel.py"
            "bin"
            "CMakeLists.txt"
            "examples"
            "packaging"
            "pyproject.toml"
            "python/CMakeLists.txt"
            "python/setup.py"
          )
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- "${PATHS[@]}")
          if [[ -n "$CHANGED" ]]; then
            echo "wheel_or_container=true" >> "$GITHUB_OUTPUT"
            echo "Wheel/container-relevant changes:"
            printf '  %s\n' $CHANGED
          else
            echo "wheel_or_container=false" >> "$GITHUB_OUTPUT"
            echo "No wheel/container-relevant changes."
          fi

  build:
    needs: [resolve-docker-tag, build-docker]
    if: ${{ always() && needs.resolve-docker-tag.result == 'success' && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') }}
    uses: ./.github/workflows/call-build.yml
    secrets: inherit
    with:
      docker_tag: ${{ needs.resolve-docker-tag.outputs.docker_tag }}

  build-wheels:
    needs: [resolve-docker-tag, build-docker]
    if: ${{ always() && needs.resolve-docker-tag.result == 'success' && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/call-build-wheels.yml
    with:
      docker_tag: ${{ needs.resolve-docker-tag.outputs.docker_tag }}

  test-sim:
    uses: ./.github/workflows/call-test-sim.yml
    secrets: inherit

  test-scripts:
    uses: ./.github/workflows/call-test-scripts.yml

  test-dist-tutorials:
    needs: [resolve-docker-tag, build-docker, changes]
    # Run when EITHER the PR touches wheel/container-relevant paths, OR the
    # container was actually rebuilt (uplift PR: new toolchain may regress
    # tutorials in ways the path filter alone cannot detect).
    if: ${{ (needs.changes.outputs.wheel_or_container == 'true' || needs.build-docker.result == 'success') && always() && needs.resolve-docker-tag.result == 'success' && (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped') }}
    permissions:
      contents: read
      packages: read
      checks: write
    uses: ./.github/workflows/call-test-dist-tutorials.yml
    secrets: inherit
    with:
      runs-on: n150
      dist_docker_tag: ${{ needs.resolve-docker-tag.outputs.docker_tag }}

  check-all-green:
    if: always()
    needs:
      - pre-commit
      - check-tt-metal-version
      - resolve-docker-tag
      - build-docker
      - changes
      - build
      - build-wheels
      - test-sim
      - test-scripts
      - test-dist-tutorials
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether all needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: build-docker, test-dist-tutorials
          jobs: ${{ toJSON(needs) }}
