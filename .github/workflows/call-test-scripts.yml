name: Test Shell Scripts

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test-scripts:
    name: "Shell-script unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install packaging (for PEP 440 normalization in require-release-tag.sh)
        run: python3 -m pip install --user packaging

      - name: Run all script tests
        run: .github/scripts/tests/run-all.sh
