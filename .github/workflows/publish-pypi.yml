name: Publish to PyPI

on:
  # TODO: Remove pull_request trigger after validating PyPI publishing.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag for the ird container."
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build-wheels:
    uses: ./.github/workflows/call-build-wheels.yml
    with:
      docker_tag: ${{ inputs.docker_tag || 'v0.1.8' }}

  publish:
    name: "Publish to PyPI"
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tt-lang/
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: tt-lang-wheels
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
