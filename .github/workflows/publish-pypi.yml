name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Docker image tag for the ird container."
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    name: "Verify release tag"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_version: ${{ steps.parse.outputs.tag_version }}
    steps:
      - name: Checkout tt-lang
        uses: actions/checkout@v5

      - name: Require release tag
        id: parse
        run: .github/scripts/require-release-tag.sh

  build-wheels:
    needs: preflight
    uses: ./.github/workflows/call-build-wheels.yml
    with:
      docker_tag: ${{ inputs.docker_tag }}

  publish:
    name: "Publish to PyPI"
    needs: [preflight, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/tt-lang/
    permissions:
      id-token: write

    steps:
      - name: Checkout tt-lang
        uses: actions/checkout@v5

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: tt-lang-wheels
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      - name: Verify wheel version matches tag
        run: .github/scripts/verify-wheel-version.sh "${{ needs.preflight.outputs.tag_version }}" dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
