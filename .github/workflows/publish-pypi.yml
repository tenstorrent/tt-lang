name: Publish to PyPI

on:
  # TODO: Remove pull_request trigger once TestPyPI publishing is validated.
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read
  packages: read

jobs:
  build-wheels:
    uses: ./.github/workflows/call-build-wheels.yml

  publish:
    name: "Publish to PyPI"
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO: Switch to production PyPI once publishing is validated.
    # Change environment name to use the target selection logic:
    #   name: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')) && 'pypi' || 'testpypi' }}
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tt-lang/
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: tt-lang-wheels
          path: dist/

      - name: List wheels
        run: ls -lh dist/

      # TODO: Remove hardcoded repository-url once validated; the target
      # selection logic in the environment block will handle it.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
