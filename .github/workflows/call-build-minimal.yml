# Part of "Plan: Minimal tt-metal and tt-mlir Integration for tt-lang"
# See: ~/tt/plans/tt-lang-minimal-dependencies.md
#
# This workflow builds:
# - tt-metal: Minimal build (Phase 2 of plan - PROVEN)
# - tt-mlir: Full build via FetchContent (Phase 1 not yet implemented)
#
# TODO: Once Phase 1 is complete, update this to use the minimal tt-mlir overlay
name: Build Minimal

on:
    workflow_dispatch:
        inputs:
            tt-metal-commit:
                description: 'tt-metal commit SHA (optional, defaults to tt-mlir pinned version)'
                required: false
                type: string
            tt-mlir-commit:
                description: 'tt-mlir commit SHA (overrides third-party/tt-mlir.commit)'
                required: false
                type: string
    workflow_call:
        inputs:
            tt-metal-commit:
                description: 'tt-metal commit SHA (optional, defaults to tt-mlir pinned version)'
                required: false
                type: string
            tt-mlir-commit:
                description: 'tt-mlir commit SHA (overrides third-party/tt-mlir.commit)'
                required: false
                type: string

permissions:
    checks: write
    contents: read

jobs:
    build-tt-metal:
        name: "Build tt-metal (minimal)"
        runs-on: ubuntu-latest
        timeout-minutes: 60

        container: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-22-04:latest

        defaults:
            run:
                shell: bash

        env:
            # Default tt-metal SHA from tt-mlir third_party/CMakeLists.txt
            DEFAULT_TT_METAL_SHA: dcae048e5901b2528f5eba67180bb2bc0c227481

        outputs:
            tt-metal-commit: ${{ steps.tt-metal-commit.outputs.commit }}

        steps:
            - name: Maximize space
              uses: tenstorrent/tt-github-actions/.github/actions/maximize_space@main

            - name: Determine tt-metal commit
              id: tt-metal-commit
              run: |
                  COMMIT="${{ inputs.tt-metal-commit }}"
                  if [ -z "$COMMIT" ]; then
                    COMMIT="${DEFAULT_TT_METAL_SHA}"
                  fi
                  echo "commit=$COMMIT" >> $GITHUB_OUTPUT
                  echo "Using tt-metal commit: $COMMIT"

            - name: Cache tt-metal build
              id: cache-tt-metal
              uses: actions/cache@v4
              with:
                  path: |
                      tt-metal/build_ultra_minimal_Release
                      tt-metal/ttnn/ttnn
                  key: tt-metal-minimal-${{ steps.tt-metal-commit.outputs.commit }}-v1

            - name: Checkout tt-metal
              if: steps.cache-tt-metal.outputs.cache-hit != 'true'
              uses: actions/checkout@v4
              with:
                  repository: tenstorrent/tt-metal
                  ref: ${{ steps.tt-metal-commit.outputs.commit }}
                  path: tt-metal
                  submodules: recursive

            - name: Setup ccache for tt-metal
              if: steps.cache-tt-metal.outputs.cache-hit != 'true'
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: tt-metal-minimal-${{ steps.tt-metal-commit.outputs.commit }}
                  max-size: 500M

            - name: Build tt-metal (minimal)
              if: steps.cache-tt-metal.outputs.cache-hit != 'true'
              working-directory: tt-metal
              run: |
                  set -x
                  echo "Building tt-metal with minimal configuration..."

                  cmake -B build_ultra_minimal_Release -G Ninja \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DCMAKE_INSTALL_PREFIX=build_ultra_minimal_Release \
                      -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-linux-clang-17-libstdcpp-toolchain.cmake \
                      -DTT_UNITY_BUILDS=ON \
                      -DENABLE_CCACHE=ON \
                      -DENABLE_TRACY=OFF \
                      -DENABLE_DISTRIBUTED=OFF \
                      -DWITH_PYTHON_BINDINGS=ON \
                      -DTTNN_BUILD_TESTS=OFF \
                      -DTT_METAL_BUILD_TESTS=OFF \
                      -DBUILD_PROGRAMMING_EXAMPLES=OFF \
                      -DBUILD_TT_TRAIN=OFF \
                      -DBUILD_TELEMETRY=OFF \
                      -DENABLE_TTNN_SHARED_SUBLIBS=OFF \
                      -DTT_ENABLE_LIGHT_METAL_TRACE=OFF

                  # Build only the essential targets
                  cmake --build build_ultra_minimal_Release --target ttnn_core
                  cmake --build build_ultra_minimal_Release --target ttnncpp
                  cmake --build build_ultra_minimal_Release --target _ttnncpp.so
                  cmake --build build_ultra_minimal_Release --target ttnn

                  echo "Build complete!"
                  echo "Build size: $(du -sh build_ultra_minimal_Release | cut -f1)"

            - name: Archive tt-metal build
              run: |
                  set -x
                  cd tt-metal

                  # Create archive with build outputs and Python package
                  tar -I 'zstd --long=31 -T0' -cf ../tt-metal-minimal.tar.zst \
                      build_ultra_minimal_Release/ttnn \
                      build_ultra_minimal_Release/tt_metal \
                      build_ultra_minimal_Release/lib \
                      ttnn/ttnn

                  ls -lh ../tt-metal-minimal.tar.zst

            - name: Upload tt-metal artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: tt-metal-minimal
                  path: tt-metal-minimal.tar.zst
                  retention-days: 1

    build-tt-lang:
        name: "Build tt-lang with vendored deps"
        needs: build-tt-metal
        runs-on: ubuntu-latest
        timeout-minutes: 180

        container: ghcr.io/tenstorrent/tt-mlir/tt-mlir-ci-ubuntu-22-04:latest

        defaults:
            run:
                shell: bash

        env:
            TT_LANG_HOME: ${{ github.workspace }}
            TTMLIR_TOOLCHAIN_DIR: /opt/ttmlir-toolchain
            CMAKE_BUILD_PARALLEL_LEVEL: 2

        steps:
            - name: Maximize space
              uses: tenstorrent/tt-github-actions/.github/actions/maximize_space@main

            - name: Checkout tt-lang
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download tt-metal artifacts
              uses: actions/download-artifact@v4
              with:
                  name: tt-metal-minimal
                  path: .

            - name: Extract tt-metal
              run: |
                  set -x
                  tar -I 'zstd --long=31' -xf tt-metal-minimal.tar.zst
                  rm -f tt-metal-minimal.tar.zst

                  # Move to expected location
                  mkdir -p third_party/tt-metal
                  mv build_ultra_minimal_Release third_party/tt-metal/
                  mv ttnn third_party/tt-metal/

                  echo "tt-metal structure:"
                  ls -la third_party/tt-metal/
                  ls -la third_party/tt-metal/build_ultra_minimal_Release/ || true

            - name: Determine tt-mlir commit
              id: ttmlir-commit
              run: |
                  bash .github/scripts/determine-ttmlir-commit.sh "${{ inputs.tt-mlir-commit }}" "third-party/tt-mlir.commit"

            - name: Get LLVM version
              id: llvm-version
              uses: ./.github/actions/get-llvm-version

            - name: Cache tt-mlir installation
              id: cache-ttmlir
              uses: actions/cache@v4
              with:
                  path: tt-mlir-install
                  key: ${{ runner.os }}-vendored-ttmlir-${{ steps.ttmlir-commit.outputs.commit }}-llvm-${{ steps.llvm-version.outputs.version }}-v1

            - name: Setup ccache for tt-lang
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ runner.os }}-ttlang-vendored-llvm${{ steps.llvm-version.outputs.version }}
                  max-size: 100M

            - name: Build tt-lang
              run: |
                  set -x
                  echo "Building tt-lang with vendored tt-metal..."

                  # Set up environment for vendored tt-metal
                  export TT_METAL_HOME=${{ github.workspace }}/third_party/tt-metal/build_ultra_minimal_Release
                  export LD_LIBRARY_PATH=$TT_METAL_HOME/tt_metal:$TT_METAL_HOME/ttnn:$TT_METAL_HOME/lib:$LD_LIBRARY_PATH

                  df -h

                  cmake -G Ninja -B build \
                      -DCMAKE_BUILD_TYPE=Release \
                      -DTTMLIR_INSTALL_PREFIX=${{ github.workspace }}/tt-mlir-install \
                      -DTTMLIR_CMAKE_BUILD_TYPE=Release \
                      -DTTMLIR_ENABLE_RUNTIME=OFF \
                      -DTTMLIR_ENABLE_RUNTIME_TESTS=OFF \
                      -DCMAKE_CXX_COMPILER=clang++-17 \
                      -DCMAKE_C_COMPILER=clang-17 \
                      -DTTMLIR_ENABLE_BINDINGS_PYTHON=ON \
                      -DTTMLIR_GIT_TAG=${{ steps.ttmlir-commit.outputs.commit }}

                  cmake --build build

            - name: Test the tt-lang build
              run: |
                  source build/env/activate
                  python test/python/smoketest.py

            - name: Run ttlang Lit MLIR tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-mlir

            - name: Run ttlang Python bindings tests
              run: |
                  source build/env/activate
                  cmake --build build --target check-ttlang-python-bindings

            - name: Archive build artifacts
              run: |
                  set -x
                  ARTIFACT_NAME=$(.github/scripts/get-artifact-archive-name.sh "${{ github.sha }}")
                  echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

                  tar -I 'zstd --long=31 --adapt=min=9 -T0' -cf "${ARTIFACT_NAME}" \
                      tt-mlir-install build/python_packages build/test build/env

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: ttlang-minimal-ttmlir-install-ubuntu
                  path: ${{ env.ARTIFACT_NAME }}
                  if-no-files-found: error
                  retention-days: 1

    check-all-green:
        if: always()
        needs:
            - build-tt-metal
            - build-tt-lang
        runs-on: ubuntu-latest
        steps:
            - name: Decide whether all needed jobs succeeded or failed
              uses: re-actors/alls-green@release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
