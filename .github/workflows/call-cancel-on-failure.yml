name: Cancel Workflow Run

on:
  workflow_call:

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel this workflow run
        run: |
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }} || true
          sleep 5
          gh api -X POST repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/force-cancel
        env:
          GH_TOKEN: ${{ github.token }}
