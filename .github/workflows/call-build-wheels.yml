name: Build Wheels

on:
  workflow_call:
    inputs:
      python_versions:
        type: string
        default: "cp311-manylinux_x86_64* cp312-manylinux_x86_64*"

permissions:
  contents: read

jobs:
  build-toolchain:
    uses: ./.github/workflows/call-build-toolchain.yml

  build-wheels:
    name: "Build tt-lang wheel"
    needs: build-toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tt-lang
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: /opt/ttlang-toolchain
          key: ${{ needs.build-toolchain.outputs.cache-key }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: ${{ inputs.python_versions }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ENVIRONMENT: >-
            IN_CIBW_ENV=ON
            TTLANG_USE_TOOLCHAIN=ON
            TTLANG_TOOLCHAIN_DIR=/opt/ttlang-toolchain
            CC=gcc
            CXX=g++
          CIBW_BEFORE_BUILD: "pip install cmake ninja nanobind"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: ""
          CIBW_TEST_COMMAND: >-
            python -c "import ttl; print('tt-lang', ttl.__version__)" &&
            python -c "from ttl import operation, compute, datamovement" &&
            python -c "from ttl.pykernel._src.kernel_ast import TTCompilerBase"
        with:
          output-dir: ./dist
          package-dir: ./python

      - name: Report wheel size
        run: ls -lh dist/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: tt-lang-wheels
          path: dist/*.whl
          retention-days: 14
