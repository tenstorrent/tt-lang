[build-system]
requires = ["setuptools>=61.0", "cmake", "nanobind", "wheel", "pip", "ninja"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-lang"
description = "Python Bindings and Package for TT-Lang Compiler Project"
requires-python = ">=3.11"
keywords = ["mlir", "tt-lang", "tt-mlir", "tenstorrent", "compiler", "dsl", "kernel"]
license = "Apache-2.0"
license-files = ["../LICENSE*"]
authors = [
  {name = "Tenstorrent AI ULC"}
]
maintainers = [
  {name = "Tenstorrent AI ULC"}
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Code Generators"
]

dependencies = [
  "pydantic<3",
  "torch>=1.9.0",
  "numpy>=1.20.0",
  "greenlet>=3.0.0",
  "PyYAML>=5.4.0,<=6.0.1",
  "typing_extensions>=4.12.2",
  "ml_dtypes>=0.1.0,<=0.6.0; python_version<'3.13'",
  "ml_dtypes>=0.5.0,<=0.6.0; python_version>='3.13'",
]

dynamic = ["version", "readme"]

[project.optional-dependencies]
device = ["ttnn"]

[project.scripts]
ttlang-sim = "ttl.sim.ttlang_sim:main"

[project.urls]
Homepage = "https://github.com/tenstorrent/tt-lang"
Repository = "https://github.com/tenstorrent/tt-lang"
Issues = "https://github.com/tenstorrent/tt-lang/issues"

[tool.cibuildwheel]
build = "cp311-manylinux_x86_64* cp312-manylinux_x86_64* cp311-macosx_x86_64* cp312-macosx_arm64*"
skip = "*-musllinux_*"
build-verbosity = 2

[tool.pyright]
typeCheckingMode = "strict"
reportMissingParameterType = "error"
reportMissingTypeStubs = "warning"
reportMissingImports = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportUntypedFunctionDecorator = "error"
reportPrivateUsage = "error"
reportImportCycles = "error"
reportUnnecessaryIsInstance = "warning"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
