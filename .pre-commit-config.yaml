default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black
        language_version: python3
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.7
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: [-style=file, -i]
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: public-content-change
        name: Reject restricted public content in changes
        entry: python3 .github/scripts/check-public-content.py change
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: public-content-commit-message
        name: Reject restricted public content in commit messages
        entry: python3 .github/scripts/check-public-content.py commit-message
        language: system
        always_run: true
        stages: [commit-msg]
      - id: public-content-push
        name: Reject restricted public content before pushing
        entry: python3 .github/scripts/check-public-content.py push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: build-spec
        name: Regenerate TTLangSpecification.md from externalized examples
        entry: python3 docs/sphinx/specs/build_spec.py
        language: system
        pass_filenames: false
        files: ^(docs/sphinx/specs/TTLangSpecification\.externalized\.md|examples/spec/.*)$
        stages: [pre-commit]
  - repo: https://github.com/espressif/check-copyright/
    rev: v1.0.3
    hooks:
      - id: check-copyright
        args: ["--config", ".github/check-spdx.yaml"]
        types_or: [python, c++, c, shell]
        files: \.(py|cpp|cc|cxx|h|hpp|hxx|td|sh|cmake)$
        stages: [pre-commit]
